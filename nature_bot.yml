# Bu dosyayı repo'nda .github/workflows/nature_bot.yml olarak kaydet.
name: Nature Bot Daily Post

on:
  schedule:
    - cron: "0 9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # bilgi döngüsü durumunu (state) repo'ya commit'lemek için gerekli

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python twitter_nature_bot.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
