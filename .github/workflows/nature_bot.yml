name: Nature Bot Daily Post

on:
  schedule:
    # UTC -> Istanbul (UTC+3): 08:00, 14:00, 20:00
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      skip_wait:
        description: "Etkileşim hatırlatmasını (16 dk bekleme) atla - test için"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nature-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests selenium webdriver-manager

      - name: Run Nature Bot (Paylaşım Botu)
        run: python twitter_nature_bot.py
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SKIP_WAIT: ${{ inputs.skip_wait && '1' || '' }}

      # --- YENİ EKLENEN ADIM: X Advanced Bot (Takip Botu) ---
      - name: Run X Advanced Bot
        run: python x_advanced_bot.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
