name: LinkedIn Daily Nature Post
on:
  schedule:
    - cron: "0 7 * * *" # Istanbul 10:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kimlik ve içerik kontrolü yap; paylaşım oluşturma"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: linkedin-daily-post
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Check LinkedIn credentials
        id: credentials
        shell: bash
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          if [[ -n "$LINKEDIN_ACCESS_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LINKEDIN_ACCESS_TOKEN is not configured; publishing was skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish LinkedIn post
        if: steps.credentials.outputs.configured == 'true'
        run: python linkedin_bot.py
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: "202610"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
